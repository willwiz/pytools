[project]
site_url = "willwiz.github.io/pytools"
site_name = "Pytools"
docs_dir = "docs"
site_dir = "site"
clean = true
use_directory_urls = false
watch = ["src"]
extra_css = ["stylesheets/extra.css"]
# site_description = "Your project description"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/willwiz/pytools"
repo_name = "pytools"

nav = [{ "Get started" = "index.md" }, { "Markdown in 5min" = "markdown.md" }]

# extra_javascript = ["javascripts/extra.js"]

[project.theme]
variant = "modern"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
    "announce.dismiss",
    # "content.action.edit",
    # "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    # "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# Enable Zensical's native Python API auto-discovery engine
[project.plugins.api-autonav]
enabled = true
api_root_uri = "reference"          # This is the directory it builds in memory
nav_section_title = "API Reference" # The title showing up in your sidebar
exclude_private = true

# Provide the source directories to inspect
modules = [
    "src/pytools", # Core submodules (io, search, varcomp)
]

# CORRECT ZENSICAL SCHEMA MATCH:
# Use module_options with a ".*" wildcard regex string key to force the parameters
# down into the auto-generated code pages.
[project.plugins.api-autonav.module_options.".*"]
allow_inspection = true
modernize_annotations = true
inherited_members = true
show_root_heading = true
show_root_toc_entry = true
show_source = true
show_root_members = true
show_if_no_docstring = true
show_labels = true
show_module_attributes = false
show_signature = true
show_signature_annotations = true
show_signature_type_parameters = true
show_type_annotations = true
show_parameter_types = true
type_parameter_headings = true
show_object_full_path = false
signature_crossrefs = true
separate_signature = true
prefer_stubs = false
collapse_submodules = false

extensions = ["dataclasses"]
# NumPy document formatting rules
docstring_style = "numpy"
show_docstring_description = true
show_docstring_parameters = true
show_docstring_returns = true
show_docstring_attributes = true


[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_signature_annotations = true
show_docstring_description = true
show_docstring_attributes = true
show_docstring_functions = true
show_docstring_classes = true
signature_crossrefs = true
annotations_path = "brief"
