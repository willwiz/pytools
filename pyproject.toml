[build-system]
requires = ["uv_build>=0.10.9,<=0.13.1"]
build-backend = "uv_build"

[project]
name = "pytools"
version = "1.2.5"
authors = [{ name = "Will Zhang", email = "willwz@gmail.com" }]
description = "Basic tools for Python development"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 1 - Beta",
]
dependencies = [
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "pydantic",
    "scipy-stubs[scipy]>=1.18.1.0",
]

[project.scripts]
archive = "pytools.path.__main__:main_cli"
ltx = "pytools.latex.__main__:main_cli"
[tool.uv.sources]
pytools = { workspace = true }

[tool.uv.build-backend]
namespace = true

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocstrings>=1.0.8",
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.73",
]
